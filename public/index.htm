<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">
  <title>Super App - Social Platform</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="navbar">
    <div class="logo">SuperApp</div>
    <div class="vip-banner">
      VIP Bitachuuf Admin Qunnamaa: 📞 <b>0920689815</b> | Telegram: <b>@kalifaakka</b>
    </div>
    <button onclick="logout()" id="logoutBtn" style="display:none;">Logout</button>
  </header>

  <div class="container">
    <!-- Auth Box -->
    <div id="authBox" class="card">
      <h2>Galmaa'i / Seeni</h2>
      <input type="text" id="authUsername" placeholder="Username">
      <input type="password" id="authPassword" placeholder="Password">
      <input type="text" id="authName" placeholder="Maqaa Guutuu (Signup qofaaf)">
      <input type="email" id="authEmail" placeholder="Email (Signup qofaaf)">
      <div class="btn-group">
        <button onclick="login()">Login</button>
        <button onclick="signup()">Signup</button>
      </div>
    </div>

    <!-- Main Content Area -->
    <div id="appBody" style="display:none;" class="app-layout">
      
      <!-- Left Sidebar: Profile & Users -->
      <aside class="sidebar">
        <div class="card profile-card">
          <img id="userImg" src="" alt="Profile">
          <h3 id="userName"></h3>
          <p id="userBio"></p>
          <button onclick="editProfile()">Edit Profile</button>
        </div>

        <div class="card">
          <h3>Maammiltoota (Chat & Call)</h3>
          <ul id="usersList"></ul>
        </div>
      </aside>

      <!-- Center: Feed & Posts -->
      <main class="feed">
        <div class="card create-post">
          <textarea id="postContent" placeholder="Waan yaadde barreessi, link video/audio TikTok/Live kaawwadhu..."></textarea>
          <input type="text" id="mediaUrl" placeholder="Media URL (Image/Video/Audio)">
          <select id="mediaType">
            <option value="none">Text Qofa</option>
            <option value="image">Fakki (Image)</option>
            <option value="video">Video (TikTok Style)</option>
            <option value="audio">Sagalee (Audio)</option>
          </select>
          <button onclick="createPost()">Post Ergi</button>
        </div>

        <div id="notifications" class="card" style="background:#fff3cd;"></div>

        <div id="postsFeed"></div>
      </main>

      <!-- Right Sidebar: Admin Panel (If Admin) -->
      <aside class="sidebar" id="adminPanel" style="display:none;">
        <div class="card">
          <h3>Admin Control Panel</h3>
          <h4>Postii Mirkaneessuuf (Pending)</h4>
          <div id="pendingPosts"></div>
        </div>
      </aside>
    </div>
  </div>

  <!-- Video Call Ringing Modal -->
  <div id="callModal" class="modal" style="display:none;">
    <div class="modal-content card">
      <h3 id="callerNameText">Bilbila Video...</h3>
      <div class="video-grid">
        <video id="localVideo" autoplay playsinline muted></video>
        <video id="remoteVideo" autoplay playsinline></video>
      </div>
      <div class="btn-group">
        <button id="acceptCallBtn" style="background:green; color:white;">Deebisi</button>
        <button onclick="endCall()" style="background:red; color:white;">Kutuu</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
